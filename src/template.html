<title>Ma conso électrique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concept : un relevé de compteur. Chiffres en chasse fixe, ambre pour l'heure pleine (chère), bleu-vert pour l'heure creuse (économique). */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#142029; --muted:#586775; --line:#dce3e9;
  --hp:#d9731a; --hc:#17808f; --accent:#2457a6; --accent-ink:#ffffff;
  --good:#17703f; --bad:#b3261e; --alt:#7b4fb8; --soft:#e8eef3;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161d; --surface:#16212a; --ink:#e7edf2; --muted:#93a2af; --line:#273541;
  --hp:#f0954a; --hc:#43b8c8; --accent:#86b3ff; --accent-ink:#0e161d;
  --good:#57c98a; --bad:#ff8f85; --alt:#b99cf2; --soft:#1d2a35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161d; --surface:#16212a; --ink:#e7edf2; --muted:#93a2af; --line:#273541;
  --hp:#f0954a; --hc:#43b8c8; --accent:#86b3ff; --accent-ink:#0e161d;
  --good:#57c98a; --bad:#ff8f85; --alt:#b99cf2; --soft:#1d2a35; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0 10px}
.top small{color:var(--muted);font-family:var(--mono);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;min-width:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.range{display:flex;gap:8px;margin:-4px 0 12px;flex-wrap:wrap}

.hero{display:flex;flex-direction:column;gap:2px}
.hero .big{font-family:var(--mono);font-size:38px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.hero .lbl{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.dot.hp{background:var(--hp)}.dot.hc{background:var(--hc)}

svg.chart{display:block;width:100%;height:auto}
svg.chart text{fill:var(--muted);font-family:var(--mono);font-size:9.5px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.delta{font-family:var(--mono);font-size:13px;padding:2px 8px;border-radius:6px;background:var(--soft)}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{font-family:var(--mono);font-size:12px;min-height:90px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ranges{display:flex;flex-direction:column;gap:8px}
.rg{display:flex;align-items:center;gap:8px}
.rg .tag{flex:none;width:64px;text-align:center}
.rg input{flex:1;min-width:0}
.eqrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.eqrow input{flex:none}
.eqchecks{margin-top:4px}
.eqpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:12px}
.shr{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.shr:first-child{border-top:0;padding-top:0}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.dchip{display:inline-flex}
.dchip input{position:absolute;opacity:0;width:1px;height:1px}
.dchip span{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;cursor:pointer}
.dchip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
button.eqx{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;border-radius:8px}
.legend svg{flex:none}
select.sitesel{width:auto;max-width:100%;margin-top:4px;padding:3px 8px;font-size:13px}
.top .grow{min-width:0}
details summary{cursor:pointer;color:var(--accent)}
summary.foldh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;list-style:none;min-height:34px}
summary.foldh h3{overflow-wrap:anywhere}
summary.foldh .grow{min-width:0}
summary.foldh .tag{white-space:nowrap;flex:none}
summary.foldh .num{flex:none}
summary.foldh::-webkit-details-marker{display:none}
summary.foldh::before{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
details[open]>summary.foldh::before{transform:rotate(45deg)}
details.fold>summary.foldh{color:var(--ink)}
.stick{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -16px;padding:0 16px 1px}
.top.compact{padding:8px 0 6px;flex-wrap:nowrap;align-items:center}
.top.compact h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.compact small{white-space:nowrap;flex:none}
.stick .chips{margin-bottom:8px;flex-wrap:nowrap;overflow-x:auto;gap:5px}
.stick .chip{padding:6px 9px;font-size:12.5px;white-space:nowrap;flex:none}
.stick .range{margin:0 0 8px}
.rgblock{border-top:1px solid var(--line);padding-top:8px}
.rgblock:first-child{border-top:0;padding-top:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btn{font:inherit;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.msg{white-space:pre-line;font-size:13px;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--soft)}
.warn{background:var(--soft);border-left:3px solid var(--hp);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:12px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav input{flex:1;text-align:center}
.iconbtn{font:inherit;font-size:18px;line-height:1;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.slot{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.tscroll{overflow-x:auto}
table.t th,table.t td{padding:5px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:500;border-top:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{font:inherit;font-size:10.5px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft)}
nav.tabs button{position:relative}
.tabdot{position:absolute;top:6px;right:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:var(--hp);border:2px solid var(--bg)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<script>window.SEED=/*SEED*/null;</script>
